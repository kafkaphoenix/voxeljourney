[window]
title = "Voxel Journey"
width = 1280
height = 720
posX = 100
posY = 100
vsync = true
mode = "windowed"

[player]
spawn = [0, 1, 0]

[characterController]
walkSpeed = 20.0
runSpeed = 40.0
mouseSensitivity = 0.1
mouseSmoothAlpha = 0.5
turnResponsiveness = 4.0
useRootMotion = true

[camera]
fov = 90.0
nearPlane = 0.5
farPlane = 500.0

[cameraController]
# Third-person camera parameters3   
followDistance = 10.0
followHeight = 5.0
# First-person camera parameters
eyeHeight = 3.0
eyeForwardOffset = 0.15

[render]
msaaSamples = 4
anisotropy = 8.0

[postProcess]
exposure = 0.55

[stats]
enabled = true
refreshInterval = 0.5

[world]
renderDistance = 8
