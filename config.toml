[window]
title = "Voxel Journey"
width = 1280
height = 720
posX = 100
posY = 100
vsync = true
mode = "windowed"

[player]
spawn = [0, 0, 0]

[characterController]
walkSpeed = 20.0
runSpeed = 40.0
mouseSensitivity = 0.1
mouseSmoothAlpha = 0.5
useFixedStep = true
fixedHz = 60.0

[camera]
fov = 90.0
nearPlane = 0.5
farPlane = 500.0
aspectRatio = 1.77777777778

[cameraController]
# Third-person camera parameters
followDistance = 10.0
followHeight = 10.0
# First-person camera parameters
eyeHeight = 5.0
eyeForwardOffset = 0.15

[render]
msaaSamples = 4
anisotropy = 8.0

[postProcess]
exposure = 0.55

[stats]
enabled = true
refreshInterval = 0.5

[world]
renderDistance = 8
